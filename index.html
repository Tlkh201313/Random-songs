<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Random Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #121212;
      --bg-highlight: #1f1f1f;
      --bg-card: #181818;
      --bg-card-hover: #282828;
      --text: #ffffff;
      --text-sub: #b3b3b3;
      --text-muted: #727272;
      --green: #1db954;
      --green-hover: #1ed760;
      --line: rgba(255, 255, 255, 0.1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-base);
      color: var(--text);
      min-height: 100dvh;
    }

    .shell {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem clamp(1rem, 3vw, 1.5rem);
      background: rgba(0, 0, 0, 0.45);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
    }

    .brand svg {
      width: 26px;
      height: 26px;
      fill: var(--green);
    }

    .content {
      padding: clamp(1rem, 3vw, 1.75rem);
      overflow: auto;
    }

    .hero-bg {
      position: relative;
      border-radius: 12px;
      padding: clamp(1.25rem, 3vw, 2rem);
      background:
        linear-gradient(180deg, rgba(29, 185, 84, 0.22) 0%, rgba(18, 18, 18, 0) 55%),
        linear-gradient(135deg, #450a0a 0%, #1e1b4b 38%, #121212 72%);
      margin-bottom: 1.25rem;
    }

    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, transparent 40%, rgba(18, 18, 18, 0.85));
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
    }

    .greeting {
      font-size: clamp(1.6rem, 4vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 0.35rem;
    }

    .hero-sub {
      color: var(--text-sub);
      font-size: 0.92rem;
      margin-bottom: 1.25rem;
      max-width: 42ch;
    }

    .panel {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .banner {
      --banner-color: #4568dc;
      width: 100%;
      min-height: clamp(132px, 20vw, 196px);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(0.85rem, 2vw, 1.35rem);
      padding: clamp(0.85rem, 2vw, 1.1rem);
      border-radius: 8px;
      background: linear-gradient(
        90deg,
        color-mix(in srgb, var(--banner-color) 90%, #000),
        color-mix(in srgb, var(--banner-color) 70%, #121212)
      );
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .banner.flashing {
      transform: scale(1.006);
    }

    .banner.landed {
      animation: land-banner 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes land-banner {
      0% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }

    .art-wrap {
      width: clamp(96px, 15vw, 160px);
      aspect-ratio: 1;
    }

    .art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .meta {
      min-width: 0;
      display: grid;
      gap: 0.3rem;
    }

    .type-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
    }

    .track {
      font-size: clamp(1.05rem, 2.6vw, 1.65rem);
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: clamp(0.88rem, 1.8vw, 1.05rem);
      color: rgba(255, 255, 255, 0.86);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.62);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-pill {
      justify-self: start;
      margin-top: 0.2rem;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.25rem 0.5rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .icon-btn,
    .play-btn {
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.88);
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.04);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .play-btn {
      width: clamp(48px, 6vw, 56px);
      height: clamp(48px, 6vw, 56px);
      border-radius: 50%;
      background: var(--green);
      color: #000;
    }

    .play-btn:hover {
      transform: scale(1.06);
      background: var(--green-hover);
    }

    .play-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      margin-left: 2px;
    }

    .play-btn.is-playing svg {
      margin-left: 0;
    }

    .controls-block {
      margin-top: 1.15rem;
      display: grid;
      gap: 0.85rem;
    }

    .pick-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      width: 100%;
      max-width: 420px;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #000;
      background: var(--green);
      padding: 1rem 1.5rem;
      border-radius: 999px;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .pick-btn:hover:not(:disabled) {
      background: var(--green-hover);
      transform: scale(1.02);
    }

    .pick-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-ui {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #535353;
      position: relative;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .toggle-ui::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s ease;
    }

    .toggle input:checked + .toggle-ui {
      background: var(--green);
    }

    .toggle input:checked + .toggle-ui::after {
      transform: translateX(20px);
    }

    .toggle input:focus-visible + .toggle-ui {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .toggle-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .progress-wrap {
      width: 100%;
      max-width: 420px;
      height: 4px;
      background: #535353;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: inherit;
      transition: width 0.1s linear;
    }

    .status {
      font-size: 0.84rem;
      color: var(--text-sub);
      min-height: 1.2em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--bg-highlight);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
    }

    .links a:hover {
      background: var(--bg-card-hover);
    }

    .skeleton .art,
    .skeleton .track,
    .skeleton .artist,
    .skeleton .album {
      background: rgba(255, 255, 255, 0.1);
      color: transparent;
      border-radius: 6px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .skeleton .track { height: 1.5rem; width: min(65%, 340px); }
    .skeleton .artist { height: 1rem; width: min(45%, 240px); }
    .skeleton .album { height: 0.85rem; width: min(38%, 200px); }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .now-playing-bar {
      border-top: 1px solid var(--line);
      background: #181818;
      padding: 0.65rem clamp(1rem, 3vw, 1.5rem);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 64px;
    }

    .mini-art {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--bg-highlight);
    }

    .mini-meta {
      min-width: 0;
      flex: 1;
    }

    .mini-track {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-artist {
      font-size: 0.72rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 720px) {
      .banner {
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
      }

      .actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }

      .pick-btn {
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .banner,
      .banner.landed,
      .pick-btn,
      .play-btn,
      .skeleton .art,
      .skeleton .track,
      .skeleton .artist,
      .skeleton .album,
      .progress-bar {
        animation: none;
        transition: none;
      }

      .banner.flashing {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        Random Picker
      </div>
    </header>

    <div class="content">
      <section class="hero-bg">
        <div class="hero-inner panel">
          <h1 class="greeting" id="greeting">Need a song?</h1>
          <p class="hero-sub">Each pick pulls charts from 3 random countries — K-pop, Bollywood, Latin, and more. 30s previews only.</p>

          <article class="banner skeleton" id="banner" aria-live="polite">
            <div class="art-wrap">
              <img class="art" id="art" alt="" width="160" height="160" />
            </div>

            <div class="meta">
              <span class="type-label">Song · Preview</span>
              <h2 class="track" id="track">Loading…</h2>
              <p class="artist" id="artist">Please wait</p>
              <p class="album" id="album"></p>
              <span class="preview-pill" id="previewPill" hidden>Preview</span>
            </div>

            <div class="actions">
              <button type="button" class="icon-btn" id="openBtn" title="Open in Spotify" aria-label="Open in Spotify">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
              </button>
              <button type="button" class="play-btn" id="playBtn" title="Play preview" aria-label="Play preview">
                <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>
          </article>

          <div class="controls-block">
            <button type="button" class="pick-btn" id="pickBtn">Pick a song</button>

            <div class="options-row">
              <label class="toggle">
                <input type="checkbox" id="autoShuffle" />
                <span class="toggle-ui" aria-hidden="true"></span>
                <span class="toggle-label">Auto shuffle when preview ends</span>
              </label>
            </div>

            <div class="progress-wrap" aria-hidden="true">
              <div class="progress-bar" id="progressBar"></div>
            </div>

            <p class="status" id="status"></p>
            <div class="links" id="links"></div>
          </div>
        </div>
      </section>
    </div>

    <footer class="now-playing-bar">
      <img class="mini-art" id="miniArt" alt="" width="44" height="44" />
      <div class="mini-meta">
        <p class="mini-track" id="miniTrack">Nothing playing</p>
        <p class="mini-artist" id="miniArtist">Hit Pick a song · 30s previews (no Premium needed)</p>
      </div>
    </footer>
  </div>

  <audio id="audio" preload="none"></audio>

  <script>
    const CHART_STORES = [
      "us", "gb", "ca", "au", "jp", "kr", "hk", "tw", "sg", "in", "th", "id", "ph", "my", "vn",
      "fr", "de", "es", "it", "pt", "nl", "se", "no", "pl", "tr", "mx", "br", "ar", "co", "za", "ng", "eg", "sa", "ae", "il", "ru",
    ];
    const CHART_GENRES = [14, 21, 7, 11, 6, 17, 25, 20, 18, 50, 15, 24, 27, 28, 4, 19];
    const STORE_LABELS = {
      us: "US", gb: "UK", ca: "Canada", au: "Australia", jp: "Japan", kr: "Korea", hk: "Hong Kong",
      tw: "Taiwan", sg: "Singapore", in: "India", th: "Thailand", id: "Indonesia", ph: "Philippines",
      my: "Malaysia", vn: "Vietnam", fr: "France", de: "Germany", es: "Spain", it: "Italy", pt: "Portugal",
      nl: "Netherlands", se: "Sweden", no: "Norway", pl: "Poland", tr: "Turkey", mx: "Mexico", br: "Brazil",
      ar: "Argentina", co: "Colombia", za: "South Africa", ng: "Nigeria", eg: "Egypt", sa: "Saudi Arabia",
      ae: "UAE", il: "Israel", ru: "Russia",
    };

    const GREETINGS = [
      "Feel bored?",
      "Need a song?",
      "Music roulette time",
      "Can't pick? Let fate decide",
      "Shuffle my mood",
      "Surprise me",
      "What should I listen to?",
      "Spin the globe",
      "Random vibes only",
      "Hit me with a banger",
      "No idea what to play?",
      "Let the charts decide",
      "Feeling adventurous?",
      "One click, one song",
      "Your ears deserve this",
      "Skip the scroll",
      "Pick for me",
      "Global shuffle time",
      "Surprise your ears",
      "Bored? Same.",
      "Need a vibe check",
      "Trust the shuffle",
      "Something new, please",
      "Chart roulette",
      "Play something random",
      "Don't think, just listen",
      "Fresh track incoming",
      "Spin it",
      "What’s on today?",
      "Let luck pick your song",
    ];

    function pickGreeting() {
      return GREETINGS[Math.floor(Math.random() * GREETINGS.length)];
    }

    const FALLBACK_COLORS = [
      "#1db954", "#4775f7", "#e13300", "#8d67ab", "#ba5d07", "#148a08",
      "#dc148c", "#2563eb", "#9333ea", "#0891b2", "#ca8a04", "#0d9488",
    ];

    const banner = document.getElementById("banner");
    const art = document.getElementById("art");
    const trackEl = document.getElementById("track");
    const artistEl = document.getElementById("artist");
    const albumEl = document.getElementById("album");
    const previewPill = document.getElementById("previewPill");
    const statusEl = document.getElementById("status");
    const linksEl = document.getElementById("links");
    const pickBtn = document.getElementById("pickBtn");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const openBtn = document.getElementById("openBtn");
    const audio = document.getElementById("audio");
    const autoShuffleEl = document.getElementById("autoShuffle");
    const progressBar = document.getElementById("progressBar");
    const miniArt = document.getElementById("miniArt");
    const miniTrack = document.getElementById("miniTrack");
    const miniArtist = document.getElementById("miniArtist");
    const greetingEl = document.getElementById("greeting");

    let currentSong = null;
    let spotifyUrl = "https://open.spotify.com/";
    let flashTimer = null;
    let rolling = false;
    let reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let cachedPool = [];

    greetingEl.textContent = pickGreeting();

    const savedAuto = localStorage.getItem("spotify-picker-auto-shuffle");
    if (savedAuto === "1") autoShuffleEl.checked = true;

    autoShuffleEl.addEventListener("change", () => {
      localStorage.setItem("spotify-picker-auto-shuffle", autoShuffleEl.checked ? "1" : "0");
    });

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function pickChartCountries() {
      return shuffle(CHART_STORES).slice(0, 3);
    }

    function storeLabel(code) {
      return STORE_LABELS[code] || String(code || "").toUpperCase();
    }

    function parseTrackId(url) {
      if (!url) return null;
      const match = String(url).match(/[?&]i=(\d+)/);
      return match ? match[1] : null;
    }

    function normalizeLookup(item, country) {
      return {
        trackId: item.trackId,
        trackName: item.trackName,
        artistName: item.artistName,
        collectionName: item.collectionName || "",
        artworkUrl100: item.artworkUrl100 || item.artworkUrl60 || "",
        previewUrl: item.previewUrl || "",
        trackViewUrl: item.trackViewUrl || "",
        country: country,
      };
    }

    function parseChartEntries(entries, country) {
      const list = Array.isArray(entries) ? entries : entries ? [entries] : [];
      return list
        .map((entry) => {
          const trackName = entry["im:name"]?.label;
          const artistName = entry["im:artist"]?.label;
          const images = entry["im:image"] || [];
          const artworkUrl100 = images.length ? images[images.length - 1].label : "";
          const idUrl = entry.id?.label || "";
          const trackId = parseTrackId(idUrl);
          const collectionName = entry["im:collection"]?.["im:name"]?.label || "";
          return {
            trackId,
            trackName,
            artistName,
            collectionName,
            artworkUrl100,
            previewUrl: "",
            trackViewUrl: idUrl,
            country,
          };
        })
        .filter((song) => song.trackName && song.artistName);
    }

    async function fetchChart(country, genreId) {
      const base = "https://itunes.apple.com/" + country + "/rss/topsongs/limit=50";
      const url = genreId ? base + "/genre=" + genreId + "/json" : base + "/json";
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      return parseChartEntries(data.feed?.entry, country);
    }

    async function lookupPreviews(songs, country) {
      const ids = songs.map((s) => s.trackId).filter(Boolean);
      if (!ids.length) return songs;

      const lookupMap = new Map();
      const chunkSize = 50;

      for (let i = 0; i < ids.length; i += chunkSize) {
        const chunk = ids.slice(i, i + chunkSize);
        const url =
          "https://itunes.apple.com/lookup?id=" +
          chunk.join(",") +
          "&country=" +
          country +
          "&entity=song";

        const res = await fetch(url);
        if (!res.ok) continue;

        const data = await res.json();
        for (const item of data.results || []) {
          if (item.wrapperType !== "track") continue;
          lookupMap.set(String(item.trackId), normalizeLookup(item, country));
        }
      }

      return songs.map((song) => {
        const found = song.trackId ? lookupMap.get(String(song.trackId)) : null;
        return found || song;
      });
    }

    function diversifyPool(songs, maxPerCountry) {
      const seenTracks = new Set();
      const seenArtists = new Set();
      const countryCount = new Map();
      const cap = maxPerCountry || Infinity;
      const diverse = [];

      for (const song of shuffle(songs)) {
        const trackKey = song.trackId || song.trackName + "|" + song.artistName;
        const artistKey = String(song.artistName || "").toLowerCase();
        const country = song.country || "xx";
        if (seenTracks.has(trackKey)) continue;
        if (seenArtists.has(artistKey)) continue;
        if ((countryCount.get(country) || 0) >= cap) continue;
        seenTracks.add(trackKey);
        seenArtists.add(artistKey);
        countryCount.set(country, (countryCount.get(country) || 0) + 1);
        diverse.push(song);
      }

      return diverse;
    }

    async function fetchChartsRaw() {
      const countries = pickChartCountries();
      const jobs = [];

      for (const country of countries) {
        jobs.push(fetchChart(country, null));
        jobs.push(fetchChart(country, pick(CHART_GENRES)));
      }

      const batches = await Promise.all(jobs);
      const seen = new Set();
      const raw = [];

      for (const song of batches.flat()) {
        const key = song.trackId || song.trackName + "|" + song.artistName;
        if (seen.has(key)) continue;
        seen.add(key);
        raw.push(song);
      }

      if (raw.length < 8) throw new Error("Not enough chart songs. Try again.");
      return { raw, countries };
    }

    async function buildSongPool() {
      const { raw, countries } = await fetchChartsRaw();
      cachedPool = diversifyPool(raw, 5);

      const enrichedGroups = await Promise.all(
        countries.map((country) => {
          const countrySongs = raw.filter((song) => song.country === country).slice(0, 80);
          return lookupPreviews(countrySongs, country);
        })
      );

      const enriched = enrichedGroups.flat();
      const withPreview = enriched.filter((song) => song.previewUrl);
      const pool = diversifyPool(withPreview.length >= 16 ? withPreview : enriched, 4);

      if (pool.length < 8) throw new Error("Not enough playable songs. Try again.");
      cachedPool = pool;
      return shuffle(pool);
    }

    function spotifySearchUrl(track, artist) {
      return "https://open.spotify.com/search/" + encodeURIComponent(track + " " + artist);
    }

    function setRolling(isRolling) {
      rolling = isRolling;
      pickBtn.disabled = isRolling;
      pickBtn.textContent = isRolling ? "Shuffling…" : "Pick a song";
      banner.classList.toggle("skeleton", isRolling && !banner.classList.contains("flashing"));
      banner.classList.toggle("flashing", isRolling);
    }

    function clearFlashTimer() {
      if (flashTimer) {
        clearTimeout(flashTimer);
        flashTimer = null;
      }
    }

    function setPlayIcon(playing) {
      playBtn.classList.toggle("is-playing", playing);
      playIcon.innerHTML = playing
        ? '<path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }

    function stopPreview() {
      audio.pause();
      audio.currentTime = 0;
      setPlayIcon(false);
      progressBar.style.width = "0%";
    }

    function setBannerColor(color) {
      banner.style.setProperty("--banner-color", color);
    }

    function updateMiniBar(song) {
      if (!song) {
        miniTrack.textContent = "Nothing playing";
        miniArtist.textContent = "Hit Pick a song · 30s previews (full song via Spotify link)";
        miniArt.removeAttribute("src");
        return;
      }
      miniTrack.textContent = song.trackName;
      miniArtist.textContent = song.artistName;
      if (song.artworkUrl100) {
        miniArt.src = song.artworkUrl100.replace("100x100", "200x200");
        miniArt.alt = song.trackName;
      }
    }

    function colorFromImage(img) {
      return new Promise((resolve) => {
        if (!img.complete || !img.naturalWidth) {
          resolve(pick(FALLBACK_COLORS));
          return;
        }

        const canvas = document.createElement("canvas");
        const size = 32;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          resolve(pick(FALLBACK_COLORS));
          return;
        }

        try {
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;
          let r = 0;
          let g = 0;
          let b = 0;
          let count = 0;

          for (let i = 0; i < data.length; i += 16) {
            if (data[i + 3] < 40) continue;
            r += data[i];
            g += data[i + 1];
            b += data[i + 2];
            count += 1;
          }

          if (!count) {
            resolve(pick(FALLBACK_COLORS));
            return;
          }

          resolve("rgb(" + Math.round(r / count) + ", " + Math.round(g / count) + ", " + Math.round(b / count) + ")");
        } catch {
          resolve(pick(FALLBACK_COLORS));
        }
      });
    }

    function renderWarmupFlash() {
      trackEl.textContent = "Shuffling…";
      artistEl.textContent = "Pulling charts";
      albumEl.textContent = "";
      art.alt = "";
      previewPill.hidden = true;
      linksEl.innerHTML = "";
      setBannerColor(pick(FALLBACK_COLORS));
    }

    function renderFlash(song) {
      trackEl.textContent = song.trackName;
      artistEl.textContent = song.artistName;
      albumEl.textContent = song.collectionName || "";
      art.alt = song.trackName + " by " + song.artistName;
      art.src = song.artworkUrl100
        ? song.artworkUrl100.replace("100x100", "300x300")
        : "";
      previewPill.hidden = true;
      linksEl.innerHTML = "";
      setBannerColor(pick(FALLBACK_COLORS));
    }

    function renderSong(song, options) {
      const opts = options || {};
      currentSong = song;
      spotifyUrl = spotifySearchUrl(song.trackName, song.artistName);

      trackEl.textContent = song.trackName;
      artistEl.textContent = song.artistName;
      albumEl.textContent = song.collectionName || "";
      art.alt = song.trackName + " by " + song.artistName;
      art.src = song.artworkUrl100
        ? song.artworkUrl100.replace("100x100", "600x600")
        : "";

      previewPill.hidden = !song.previewUrl;
      updateMiniBar(song);

      const typeLabel = document.querySelector(".type-label");
      if (typeLabel) {
        typeLabel.textContent = song.country
          ? "Song · Preview · " + storeLabel(song.country) + " chart"
          : "Song · Preview";
      }

      if (opts.final) {
        linksEl.innerHTML =
          '<a href="' + spotifyUrl + '" target="_blank" rel="noopener noreferrer">Open full song in Spotify</a>' +
          (song.trackViewUrl
            ? '<a href="' + song.trackViewUrl + '" target="_blank" rel="noopener noreferrer">Apple Music</a>'
            : "") +
          '<span style="color:var(--text-muted);font-size:0.78rem;font-weight:500;">30s preview here · full track in Spotify app (free OK)</span>';
      }

      if (!opts.skipAudio) {
        stopPreview();
        audio.src = song.previewUrl || "";
      }
    }

    function applyArtColor() {
      art.onload = () => colorFromImage(art).then(setBannerColor);
      if (art.complete && art.naturalWidth) colorFromImage(art).then(setBannerColor);
    }

    function autoplayPreview() {
      if (!currentSong || !currentSong.previewUrl) return;

      audio.src = currentSong.previewUrl;
      audio.play()
        .then(() => {
          setPlayIcon(true);
          statusEl.textContent = "Preview playing. Full track on Spotify.";
        })
        .catch(() => {
          statusEl.textContent = "Tap the green play button if autoplay is blocked.";
        });
    }

    function finishRoll(finalSong, flipCount) {
      banner.classList.remove("flashing", "skeleton");
      banner.classList.add("landed");
      setRolling(false);

      renderSong(finalSong, { final: true, skipAudio: true });
      applyArtColor();
      autoplayPreview();

      statusEl.textContent =
        "Locked in after " + flipCount + " flash" + (flipCount === 1 ? "" : "es") +
        (finalSong.country ? " · " + storeLabel(finalSong.country) + " chart" : "") +
        ". Preview playing.";

      setTimeout(() => banner.classList.remove("landed"), 500);
    }

    function flashThroughPool(poolPromise) {
      return new Promise((resolve, reject) => {
        let livePool = cachedPool.length >= 4 ? cachedPool : [];
        let totalFlips = reduceMotion ? 1 : 30 + Math.floor(Math.random() * 18);
        let flipCount = 0;
        let intervalMs = reduceMotion ? 0 : 48;

        poolPromise
          .then((pool) => {
            livePool = pool;
          })
          .catch(reject);

        function step() {
          if (flipCount >= totalFlips) {
            poolPromise
              .then((pool) => {
                const previewPool = pool.filter((s) => s.previewUrl);
                finishRoll(pick(previewPool.length ? previewPool : pool), flipCount);
                resolve();
              })
              .catch(reject);
            return;
          }

          if (livePool.length >= 4) {
            renderFlash(pick(livePool));
          } else {
            renderWarmupFlash();
          }

          flipCount += 1;
          statusEl.textContent = livePool.length >= 4
            ? "Global shuffle… " + flipCount + " songs"
            : "Loading charts from around the world…";

          intervalMs = Math.max(28, intervalMs - 2.2);
          flashTimer = setTimeout(step, intervalMs);
        }

        step();
      });
    }

    function rollSong() {
      if (rolling) return;

      clearFlashTimer();
      stopPreview();
      banner.classList.remove("landed", "skeleton");
      setRolling(true);
      linksEl.innerHTML = "";
      statusEl.textContent = "Starting shuffle…";

      if (cachedPool.length >= 4) {
        renderFlash(pick(cachedPool));
      } else {
        renderWarmupFlash();
      }

      const poolPromise = buildSongPool();

      flashThroughPool(poolPromise).catch((err) => {
        clearFlashTimer();
        banner.classList.remove("flashing", "skeleton", "landed");
        setRolling(false);
        trackEl.textContent = "Could not load songs";
        artistEl.textContent = err.message || "Try again.";
        albumEl.textContent = "";
        statusEl.textContent = "";
        linksEl.innerHTML = "";
      });
    }

    pickBtn.addEventListener("click", rollSong);

    playBtn.addEventListener("click", () => {
      if (!currentSong || !currentSong.previewUrl) {
        window.open(spotifyUrl, "_blank", "noopener,noreferrer");
        return;
      }

      if (audio.paused) {
        audio.play().then(() => setPlayIcon(true)).catch(() => {
          statusEl.textContent = "Preview blocked. Open in Spotify instead.";
        });
      } else {
        stopPreview();
      }
    });

    openBtn.addEventListener("click", () => {
      window.open(spotifyUrl, "_blank", "noopener,noreferrer");
    });

    audio.addEventListener("timeupdate", () => {
      if (!audio.duration) return;
      progressBar.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    });

    audio.addEventListener("ended", () => {
      setPlayIcon(false);
      progressBar.style.width = "0%";

      if (autoShuffleEl.checked && !rolling) {
        statusEl.textContent = "Preview ended. Auto shuffling…";
        rollSong();
      }
    });

    updateMiniBar(null);
  </script>
</body>
</html>
